base_model: HuggingFaceTB/SmolVLM-500M-Instruct
dataset: data/dataset
output_dir: checkpoints/chashma-500m-lora
longest_edge: 1536
epochs: 2
batch_size: 2
grad_accum: 8
lr: 2.0e-4
warmup_ratio: 0.03
gradient_checkpointing: true
eval_steps: 200
save_steps: 200
max_eval_samples: 300
lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
