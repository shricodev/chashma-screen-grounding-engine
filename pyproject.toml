[project]
name = "chashma"
version = "0.1.0"
description = "A tiny on-device GUI grounding model: screenshot + instruction -> where to click."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shrijal Acharya", email = "shrijal.acharya@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.4",
    "pydantic>=2.8",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
crawl = ["httpx>=0.27", "playwright>=1.48"]
llm = ["anthropic>=0.40", "openai>=1.50"]
ml = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "peft>=0.13",
    "torch>=2.4",
    "huggingface-hub>=0.26",
    "transformers>=4.57",
    "torchvision>=0.29.2",
]
serve = ["fastapi>=0.115", "python-multipart>=0.0.12", "uvicorn[standard]>=0.30"]
all = ["chashma[crawl,llm,ml,serve]"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
chashma = "chashma.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chashma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
